spring.application.name=hbti-coach
server.port=8080

spring.profiles.active=${APP_PROFILE:minimax}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/hbti_coach?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_SIZE:10}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:200ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:200ms}

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

mybatis.configuration.map-underscore-to-camel-case=true

hbti.auth.issuer=hbti-coach
hbti.auth.signing-key=${AUTH_SIGNING_KEY}
hbti.auth.access-token-ttl=15m
hbti.auth.refresh-token-ttl=30d
hbti.auth.secure-cookies=${AUTH_SECURE_COOKIES:true}

logging.level.root=INFO
logging.level.dev.langchain4j=INFO
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,database,redis
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}

hbti.coach.streaming.first-token-timeout=${COACH_FIRST_TOKEN_TIMEOUT:PT5S}
hbti.coach.streaming.total-timeout=${COACH_TOTAL_TIMEOUT:PT30S}
hbti.coach.streaming.max-concurrent=${COACH_MAX_CONCURRENT:5}
hbti.coach.streaming.circuit-failure-threshold=${COACH_CIRCUIT_FAILURE_THRESHOLD:3}
hbti.coach.streaming.circuit-open-duration=${COACH_CIRCUIT_OPEN_DURATION:PT30S}
hbti.rate.login.maximum-failures=${LOGIN_MAXIMUM_FAILURES:10}
hbti.rate.login.window=${LOGIN_RATE_WINDOW:PT15M}
hbti.rate.coach.maximum-requests=${COACH_MAXIMUM_REQUESTS:20}
hbti.rate.coach.window=${COACH_RATE_WINDOW:PT1M}
