spring.datasource.url=jdbc:h2:mem:hbti_coach;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
mybatis.configuration.map-underscore-to-camel-case=true
hbti.auth.issuer=hbti-coach-test
hbti.auth.signing-key=test-only-signing-key-32-bytes-minimum
hbti.auth.access-token-ttl=15m
hbti.auth.refresh-token-ttl=30d
hbti.auth.secure-cookies=false
hbti.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
hbti.security.cors.max-age=PT1H
