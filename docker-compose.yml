services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-hbti-local-password}
      MYSQL_DATABASE: hbti_coach
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PROFILE: ${APP_PROFILE:-offline}
      MYSQL_URL: jdbc:mysql://mysql:3306/hbti_coach?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hbti-local-password}
      REDIS_URL: redis://redis:6379
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-local-development-signing-key-min-32-bytes}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-PT1H}
      COACH_MAX_INPUT_TOKENS: ${COACH_MAX_INPUT_TOKENS:-8000}
      COACH_MAX_OUTPUT_TOKENS: ${COACH_MAX_OUTPUT_TOKENS:-1500}
      RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-true}
      RETENTION_CLEANUP_INITIAL_DELAY: ${RETENTION_CLEANUP_INITIAL_DELAY:-PT1H}
      RETENTION_CLEANUP_INTERVAL: ${RETENTION_CLEANUP_INTERVAL:-PT24H}
      REFRESH_TOKEN_RETENTION_GRACE: ${REFRESH_TOKEN_RETENTION_GRACE:-P7D}
      AUDIT_EVENT_RETENTION: ${AUDIT_EVENT_RETENTION:-P180D}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
