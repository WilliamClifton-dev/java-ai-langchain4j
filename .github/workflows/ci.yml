name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: hbti_coach
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --update-snapshots test
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/hbti_coach
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: test-password
          REDIS_URL: redis://localhost:6379

      - name: Build package
        run: mvn --batch-mode --update-snapshots -DskipTests package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hbti-coach-jar
          path: target/*.jar
          retention-days: 7

  build-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hbti-coach-jar
          path: target/

      - name: Build Docker image
        run: docker build -t hbti-coach:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d --name test-container \
            -e MYSQL_URL=jdbc:mysql://host.docker.internal:3306/hbti_coach \
            -e REDIS_URL=redis://host.docker.internal:6379 \
            -e AUTH_SIGNING_KEY=test-key-min-32-bytes-for-ci \
            hbti-coach:${{ github.sha }}
          sleep 30
          docker logs test-container
          docker stop test-container
